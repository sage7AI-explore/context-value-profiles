[project]
name = "mcv"
version = "0.0.1"
description = "Context That Pays? Why Measured Context Value Failed to Beat Cosine Similarity in a Pre-Registered Test"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
# Versions are pinned by uv.lock after the first `uv lock`. Add/remove deps as the build requires; record why in README.
dependencies = [
  "httpx",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "ortools",
  "pyyaml",
  "pydantic",
  "matplotlib",
  "datasets",
  "llmlingua",
  "pypdf",
  "jsonschema",
]
[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["mcv"]
[tool.pytest.ini_options]
testpaths = ["tests"]
